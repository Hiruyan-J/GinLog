    install:
      title: アプリとしてインストール
      lead: 吟ログをアプリとしてインストールすると、すぐに開けて、画面も広く使えます。お使いの端末に合わせた以下の手順で、インストールしてご利用ください。
      # heading … 端末名 / browser … 手順がどのブラウザ向けか / note … 備考やその他のブラウザ向けの補足
      android:
        heading: Android
        browser: Chrome の場合
        steps:
          - 画面右上にある、ブラウザの「︙」（メニュー）を押す
          - 「ホーム画面に追加」を押す
          - 「インストール」を押す
        note: その他のブラウザ（Edge・Samsung インターネットなど）では、ブラウザのメニューから「ホーム画面に追加」や「インストール」を含む項目を探してみてください。
      iphone:
        heading: iPhone・iPad
        browser: Safari・Chrome などの場合
        steps:
          - ブラウザの共有ボタン（四角から上向きの矢印が出ているマーク）を押す
          - 「ホーム画面に追加」を押す
          - 「追加」を押す
        note: 共有ボタンが見当たらない場合は、ブラウザのアドレスバーの横にある「…」を押して探してみてください。
      pc:
        heading: パソコン
        browser: Chrome・Edge の場合
        steps:
          - ブラウザのアドレスバーの右側にある、インストールのアイコンを押す
          - 表示された画面の案内に沿って進み、「インストール」を押す
        note: アイコンが見当たらない場合は、ブラウザのメニューから「インストール」を含む項目を探してみてください。Mac の Safari では、メニューの「ファイル」→「Dock に追加」から追加できます。
      already_installed: すでにインストールしている場合は、ホーム画面やアプリ一覧の「吟ログ」から開けます。
